<!-- Fundo e conteúdo do diálogo de confirmação -->
<div class="fundo-modal" (click)="cancelar.emit()">
  <section
    class="modal-administrador"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="titulo-excluir-administrador"
    aria-describedby="descricao-excluir-administrador aviso-excluir-administrador"
    (click)="$event.stopPropagation()"
  >
    <!-- Alerta de exclusão -->
    <header>
      <h2 id="titulo-excluir-administrador">{{ titulo() }}</h2>
      <p class="descricao-modal" id="descricao-excluir-administrador">
        {{ pergunta() }}
      </p>
    </header>

    <!-- Dados e consequências da exclusão -->
    <div class="dados-administrador">
      <p>{{ nome() || 'Item selecionado' }}</p>
      @if (email()) {
        <span>{{ email() }}</span>
      }
    </div>

    <p class="aviso-exclusao" id="aviso-excluir-administrador">
      {{ aviso() }}
    </p>

    @if (erroServidor()) {
      <p class="erro-exclusao" role="alert">{{ erroServidor() }}</p>
    }

    <!-- Ações disponíveis no diálogo -->
    <footer class="acoes-modal">
      <button
        class="botao-cancelar"
        type="button"
        [disabled]="excluindo()"
        (click)="cancelar.emit()"
      >
        Cancelar
      </button>
      <button
        class="botao-excluir"
        type="button"
        [disabled]="excluindo()"
        (click)="confirmar.emit()"
      >
        {{ excluindo() ? textoBotaoExcluindo() : textoBotaoConfirmar() }}
      </button>
    </footer>
  </section>
</div>

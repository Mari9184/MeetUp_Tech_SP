<!-- Modal · Cadastrar administrador (seletor: app-modal-cadastrar-administrador) -->
<div class="modal-fundo" (click)="fecharModal()">
  <form
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-cadastrar"
    (click)="$event.stopPropagation()"
    (submit)="$event.preventDefault(); enviarCadastro(nome.value, email.value, senha.value)">

    <div class="apresentacao">
      <h2 id="titulo-cadastrar">Novo administrador</h2>
      <p>Cadastre uma pessoa para gerenciar os eventos e as listas de participantes.</p>
    </div>

    <label class="campo">
      <span class="campo-rotulo">Nome *</span>
      <span class="campo-caixa">
        <input #nome type="text" name="nome" placeholder="Nome do administrador" autocomplete="name" required />
      </span>
    </label>

    <label class="campo">
      <span class="campo-rotulo">E-mail *</span>
      <span class="campo-caixa">
        <img src="/icons/mail.svg" alt="" width="18" height="18" />
        <input #email type="email" name="email" placeholder="nome@exemplo.com" autocomplete="email" required />
      </span>
    </label>

    <label class="campo">
      <span class="campo-rotulo">Senha inicial *</span>
      <span class="campo-caixa">
        <img src="/icons/lock.svg" alt="" width="18" height="18" />
        <input #senha type="password" name="senha" placeholder="Defina uma senha de acesso" autocomplete="new-password" required />
      </span>
    </label>

    <p class="observacao">Perfil de acesso: Administrador. Compartilhe as credenciais por um canal seguro.</p>

    @if (mensagemErro()) {
      <p class="erro" role="alert">{{ mensagemErro() }}</p>
    }

    <div class="acoes">
      <button type="button" class="btn btn-secundario" (click)="fecharModal()">Cancelar</button>
      <button type="submit" class="btn btn-primario">Cadastrar administrador</button>
    </div>
  </form>
</div>

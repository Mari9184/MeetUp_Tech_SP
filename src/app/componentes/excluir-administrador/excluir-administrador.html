<!-- Fundo e conteúdo do diálogo de confirmação -->
<div class="fundo-modal">
  <section
    class="modal-administrador"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="titulo-excluir-administrador"
    aria-describedby="descricao-excluir-administrador aviso-excluir-administrador"
  >
    <!-- Alerta de exclusão -->
    <header>
      <h2 id="titulo-excluir-administrador">Excluir administrador</h2>
      <p class="descricao-modal" id="descricao-excluir-administrador">
        Tem certeza de que deseja remover o acesso desta pessoa?
      </p>
    </header>

    <!-- Dados e consequências da exclusão -->
    <div class="dados-administrador">
      <p>Nome do administrador</p>
      <span>nome@exemplo.com</span>
    </div>

    <p class="aviso-exclusao" id="aviso-excluir-administrador">
      Esta pessoa perderá o acesso ao painel. Os eventos que ela cadastrou serão mantidos.
    </p>

    <!-- Ações disponíveis no diálogo -->
    <footer class="acoes-modal">
      <button class="botao-cancelar" type="button">Cancelar</button>
      <button class="botao-excluir" type="button">Excluir administrador</button>
    </footer>
  </section>
</div>

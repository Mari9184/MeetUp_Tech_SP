<!-- Modal · Editar administrador (seletor: app-modal-editar-administrador) -->
<div class="modal-fundo" (click)="fecharModal()">
  <form
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-editar"
    (click)="$event.stopPropagation()"
    (submit)="$event.preventDefault(); salvarAlteracoes(nome.value, email.value)">

    <div class="apresentacao">
      <h2 id="titulo-editar">Editar administrador</h2>
      <p>Atualize os dados de acesso deste administrador.</p>
    </div>

    <label class="campo">
      <span class="campo-rotulo">Nome *</span>
      <span class="campo-caixa">
        <input #nome type="text" name="nome" [value]="administrador()?.nome ?? ''" placeholder="Nome do administrador" autocomplete="name" required />
      </span>
    </label>

    <label class="campo">
      <span class="campo-rotulo">E-mail *</span>
      <span class="campo-caixa">
        <img src="/icons/mail.svg" alt="" width="18" height="18" />
        <input #email type="email" name="email" [value]="administrador()?.email ?? ''" placeholder="nome@exemplo.com" autocomplete="email" required />
      </span>
    </label>

    <p class="observacao">Perfil de acesso: Administrador. Alterações não afetam os eventos já cadastrados.</p>

    @if (mensagemErro()) {
      <p class="erro" role="alert">{{ mensagemErro() }}</p>
    }

    <div class="acoes">
      <button type="button" class="btn btn-secundario" (click)="fecharModal()">Cancelar</button>
      <button type="submit" class="btn btn-primario">Salvar alterações</button>
    </div>
  </form>
</div>
